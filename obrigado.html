        * {
            margin: 0;
            padding: 0;

        }

        body {
            min-height: 100vh;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .hero-image {
            width: 100%;
            max-width: 520px;
            height: 220px;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        .card {
            background: #fff;
            border-radius: 0 0 18px 18px;
            max-width: 520px;
            width: 100%;
            padding: 36px 32px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-wrap {
            margin-bottom: 10px;
        }

        .logo-wrap img {
            width: 90px;
            height: auto;
        }

        .brand-name {
            margin-bottom: 24px;
            line-height: 1;
        }

        .brand-desenrola {
            display: block;
            font-size: 36px;
            font-weight: 900;
            color: #1a3fa6;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .brand-brasil {
            display: block;
            font-size: 36px;
            font-weight: 900;
            color: #3cb043;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .main-text {
            font-size: 18px;
            font-weight: 700;
            color: #1a3fa6;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .sub-text {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .btn-acessar {
            display: block;
            width: 100%;
            background: #1a3fa6;
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            border: none;
            border-radius: 10px;
            padding: 18px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: background 0.2s, transform 0.1s;
            margin-bottom: 32px;
        }

        .btn-acessar:hover {
            background: #132e82;
            transform: translateY(-1px);
        }

        .btn-acessar:active {
            transform: translateY(0);
        }

        .footer {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border-top: 1px solid #e8e8e8;
            padding: 20px 32px 28px;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 16px;
        }

        .footer-links a {
            color: #1a3fa6;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .footer-company {
            font-size: 11px;
            color: #888;
            line-height: 1.6;
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px 0;
            }
            .brand-desenrola,
            .brand-brasil {
                font-size: 30px;
            }
            .main-text {
                font-size: 16px;
            }
